[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "picsumvision"
version = "1.0.0"
description = "A graph-based searchable image repository."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
keywords = ["searchable", "image", "repository", "arangodb"]
authors = [
    {name = "Anthony Mahanna"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "colornamer==0.2.4",
    "Flask==3.1.0",
    "Flask-Cors==5.0.0",
    "gunicorn==23.0.0",
    "python-arango==8.2.2",
    "python-dotenv==1.0.1",
    "requests==2.32.3",
    "typing_extensions==4.12.2",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8.0",
]

[project.urls]
Homepage = "https://github.com/aMahanna/picsumvision"
Repository = "https://github.com/aMahanna/picsumvision"
Issues = "https://github.com/aMahanna/picsumvision/issues"

[tool.setuptools.packages.find]
include = ["server*"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "E722",  # bare except (allow for this codebase)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

